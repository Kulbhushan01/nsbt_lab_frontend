<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | NSBT Library</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

<link rel="stylesheet" href="/assets/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="sidebar">
    <div class="brand">
      <i class="fa-solid fa-book-open"></i>
      <span>NSBT Library</span>
    </div>
    <div class="brand-sub">Student Portal</div>

    <div class="user-chip">
      <div class="avatar" id="avatar">--</div>
      <div class="who">
        <div class="name" id="userName">Loading</div>
        <div class="role" id="userRole">Loading</div>
      </div>
    </div>

    <nav>
      <a href="/student/dashboard.html" class="active"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
      <a href="/student/browse.html"><i class="fa-solid fa-magnifying-glass"></i><span>Browse Books</span></a>
      <a href="/student/mybooks.html"><i class="fa-solid fa-book"></i><span>My Books</span></a>
      <a href="/student/fines.html"><i class="fa-solid fa-money-bill"></i><span>Fines</span></a>

      <div class="nav-divider"></div>

      <a href="#" class="logout" onclick="Auth.logout(); return false;"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
    </nav>

    <div class="sidebar-footer">
      <div class="links"><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a></div>
    </div>
  </div>

  <div class="main">

    <div class="topbar">
      <div>
        <h1>Dashboard</h1>
        <p class="subtitle">Books issued to you, due dates, and any pending fines</p>
      </div>
      <div class="topbar-actions">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search books...">
          <button onclick="searchBooks()">Search</button>
        </div>
      </div>
    </div>

    <div class="search-results" id="searchResults"></div>

    <div class="cards">
      <div class="card">
        <div class="card-icon"><i class="fa-solid fa-books"></i></div>
        <h3>Titles in Library</h3>
        <p id="statTitles">...</p>
      </div>
      <div class="card">
        <div class="card-icon"><i class="fa-solid fa-book"></i></div>
        <h3>Issued to You</h3>
        <p id="statIssued">...</p>
      </div>
      <div class="card">
        <div class="card-icon"><i class="fa-solid fa-clock"></i></div>
        <h3>Overdue</h3>
        <p id="statOverdue">...</p>
      </div>
      <div class="card">
        <div class="card-icon"><i class="fa-solid fa-money-bill"></i></div>
        <h3>Fine Due</h3>
        <p id="statFine">...</p>
      </div>
    </div>

  </div>

  <script src="/assets/api.js"></script>
  <script>
    const user = Auth.requireAnyRole(["student", "faculty"]);
    if (user) {
      document.getElementById("userName").textContent = user.name;
      document.getElementById("userRole").textContent = user.role;
      document.getElementById("avatar").textContent = initials(user.name);
    }

    async function loadDashboard() {
      try {
        const stats = await api("/reports/mine");
        document.getElementById("statTitles").textContent = stats.totalTitles;
        document.getElementById("statIssued").textContent = stats.issued;
        document.getElementById("statOverdue").textContent = stats.overdue;
        document.getElementById("statFine").textContent = "₹" + stats.fineDue;
      } catch (err) {
        console.error(err);
      }
    }

    async function searchBooks() {
      const searchText = document.getElementById("searchInput").value.trim();
      const searchResults = document.getElementById("searchResults");

      if (searchText === "") {
        searchResults.style.display = "none";
        searchResults.innerHTML = "";
        return;
      }

      try {
        const books = await api("/books?search=" + encodeURIComponent(searchText));
        searchResults.style.display = "block";

        if (books.length === 0) {
          searchResults.innerHTML = '<div class="panel"><p>No books found for "' + searchText + '".</p></div>';
          return;
        }

        let rows = "";
        books.forEach(function (b) {
          const available = b.available_qty > 0;
          const pillClass = available ? "available" : "unavailable";
          const label = available ? b.available_qty + " available" : "Not available";
          rows +=
            '<div class="result-row"><span>' + b.title + " by <span style=\"color:var(--muted)\">" + b.author + "</span></span>" +
            '<span class="status-pill ' + pillClass + '">' + label + "</span></div>";
        });

        searchResults.innerHTML = '<div class="panel"><h2>Search Results</h2>' + rows + "</div>";
      } catch (err) {
        searchResults.style.display = "block";
        searchResults.innerHTML = '<div class="panel"><p>' + err.message + "</p></div>";
      }
    }

    document.getElementById("searchInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") searchBooks();
    });

    if (user) loadDashboard();
  </script>

</body>
</html>
