<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Books | NSBT Library</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

<link rel="stylesheet" href="/assets/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="sidebar">
    <div class="brand">
      <i class="fa-solid fa-book-open"></i>
      <span>NSBT Library</span>
    </div>
    <div class="brand-sub">Student Portal</div>

    <div class="user-chip">
      <div class="avatar" id="avatar">--</div>
      <div class="who">
        <div class="name" id="userName">Loading</div>
        <div class="role" id="userRole">Loading</div>
      </div>
    </div>

    <nav>
      <a href="/student/dashboard.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
      <a href="/student/browse.html"><i class="fa-solid fa-magnifying-glass"></i><span>Browse Books</span></a>
      <a href="/student/mybooks.html" class="active"><i class="fa-solid fa-book"></i><span>My Books</span></a>
      <a href="/student/fines.html"><i class="fa-solid fa-money-bill"></i><span>Fines</span></a>

      <div class="nav-divider"></div>

      <a href="#" class="logout" onclick="Auth.logout(); return false;"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
    </nav>

    <div class="sidebar-footer">
      <div class="links"><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a></div>
    </div>
  </div>

  <div class="main">

    <div class="topbar">
      <div>
        <h1>My Books</h1>
        <p class="subtitle">Books currently and previously issued to your account</p>
      </div>
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr>
            <th>Book Name</th>
            <th>Author</th>
            <th>Issue Date</th>
            <th>Due Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="issueTable">
          <tr class="empty-row"><td colspan="5">Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src="/assets/api.js"></script>
  <script>
    const user = Auth.requireAnyRole(["student", "faculty"]);
    if (user) {
      document.getElementById("userName").textContent = user.name;
      document.getElementById("userRole").textContent = user.role;
      document.getElementById("avatar").textContent = initials(user.name);
    }

    async function loadMyBooks() {
      const table = document.getElementById("issueTable");
      try {
        const issues = await api("/issues");
        if (issues.length === 0) {
          table.innerHTML = '<tr class="empty-row"><td colspan="5">You have not issued any books yet.</td></tr>';
          return;
        }
        table.innerHTML = issues
          .map(function (i) {
            const overdue = isOverdue(i.due_date, i.status);
            const statusClass = i.status === "returned" ? "returned" : overdue ? "overdue" : "issued";
            const statusLabel = i.status === "returned" ? "Returned" : overdue ? "Overdue" : "Issued";
            return (
              "<tr><td>" + i.book_title + "</td><td>" + i.book_author + "</td>" +
              "<td>" + formatDate(i.issue_date) + "</td><td>" + formatDate(i.due_date) + "</td>" +
              '<td><span class="status-pill ' + statusClass + '">' + statusLabel + "</span></td></tr>"
            );
          })
          .join("");
      } catch (err) {
        table.innerHTML = '<tr class="empty-row"><td colspan="5">' + err.message + "</td></tr>";
      }
    }

    if (user) loadMyBooks();
  </script>

</body>
</html>
